<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="PokeRogue game client served locally with a same-origin account API proxy." />
    <title>PokeRogue</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
      .game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        border: 0;
        display: block;
        background: #000;
      }
    </style>
  </head>
  <body>
    <iframe
      class="game"
      src="/game-site/"
      title="PokeRogue"
      allow="autoplay; fullscreen; encrypted-media; gamepad"
      allowfullscreen
    ></iframe>
  </body>
</html>
